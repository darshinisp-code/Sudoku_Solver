<!DOCTYPE html>
<html>
<head>
    <title>Instructions</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
            background: linear-gradient(to right, #74ebd5, #ACB6E5);
        }

        .box {
            background: white;
            width: 60%;
            margin: 100px auto;
            padding: 30px;
            border-radius: 10px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
        }

        button:hover {
            background: #45a049;
        }
    </style>

</head>

<body>

<div class="box">
    <h1>🧩 Sudoku Game</h1>

    <p>✔ Fill numbers from 1 to 9</p>
    <p>✔ Each row must be unique</p>
    <p>✔ Each column must be unique</p>
    <p>✔ Each 3×3 box must be unique</p>

    <br>

    <a href="/game">
        <button>Start Game</button>
    </a>
</div>

</body>
</html>
